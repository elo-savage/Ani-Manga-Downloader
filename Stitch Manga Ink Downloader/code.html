<script>
        document.querySelectorAll('.btn-neobrutal').forEach(btn => {
            btn.addEventListener('click', function() {
                const card = this.closest('article');
                const statusBadge = card.querySelector('div.absolute.top-0.right-0') || card.querySelector('div.absolute.-top-4.-left-4');
                
                if (this.innerText === 'AVVIA DOWNLOAD') {
                    this.innerText = 'ANNULLA';
                    this.classList.remove('bg-primary', 'text-on-primary');
                    this.classList.add('bg-white', 'text-primary');
                    // Simple visual toggle for mock purposes
                    if (statusBadge) statusBadge.innerText = 'SCARICAMENTO';
                } else {
                    this.innerText = 'AVVIA DOWNLOAD';
                    this.classList.remove('bg-white', 'text-primary');
                    this.classList.add('bg-primary', 'text-on-primary');
                    if (statusBadge) statusBadge.innerText = 'IN ATTESA';
                }
            });
        });
