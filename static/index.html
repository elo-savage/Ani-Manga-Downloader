<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ani-Manga Downloader</title>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-tint": "#5e5e5e",
                        "outline-variant": "#cfc4c5",
                        "tertiary-container": "#1b1c1c",
                        "on-tertiary-fixed": "#1b1c1c",
                        "on-surface": "#1a1c1c",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-container-highest": "#e3e2e2",
                        "primary": "#000000",
                        "on-secondary-container": "#616363",
                        "surface-container-low": "#f4f3f3",
                        "surface-bright": "#faf9f9",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#464747",
                        "on-tertiary-container": "#848484",
                        "inverse-on-surface": "#f1f0f0",
                        "on-error-container": "#93000a",
                        "outline": "#7e7576",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#c6c6c6",
                        "surface-container-high": "#e9e8e8",
                        "surface-variant": "#e3e2e2",
                        "on-secondary-fixed": "#1a1c1c",
                        "inverse-surface": "#2f3131",
                        "surface-container-lowest": "#ffffff",
                        "background": "#faf9f9",
                        "secondary": "#5d5f5f",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-primary-fixed-variant": "#474747",
                        "secondary-container": "#dfe0e0",
                        "primary-container": "#1b1b1b",
                        "surface": "#faf9f9",
                        "on-surface-variant": "#4c4546",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eeeeed",
                        "on-primary-fixed": "#1b1b1b",
                        "surface-dim": "#dadada",
                        "tertiary": "#000000",
                        "tertiary-fixed-dim": "#c7c6c6",
                        "secondary-fixed": "#e2e2e2",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-background": "#1a1c1c",
                        "tertiary-fixed": "#e3e2e2",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#848484",
                        "primary-fixed": "#e2e2e2"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin": "32px",
                        "xl": "64px",
                        "sm": "8px",
                        "xs": "4px",
                        "md": "16px",
                        "lg": "32px",
                        "gutter": "24px",
                        "unit": "4px"
                    },
                    fontFamily: {
                        "headline-xl": ["Epilogue"],
                        "data-mono": ["Space Grotesk"],
                        "headline-lg": ["Epilogue"],
                        "body-md": ["Work Sans"],
                        "body-lg": ["Work Sans"]
                    },
                    fontSize: {
                        "headline-xl": ["64px", { lineHeight: "1.0", letterSpacing: "-0.04em", fontWeight: "900" }],
                        "data-mono": ["14px", { lineHeight: "1.2", letterSpacing: "0.05em", fontWeight: "600" }],
                        "headline-lg": ["40px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "body-md": ["16px", { lineHeight: "1.5", letterSpacing: "0", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "1.5", letterSpacing: "0", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Manga Patterns & Neobrutalist Utilities */
        .screentone-bg {
            background-color: #faf9f9;
            background-image: radial-gradient(#c6c6c6 1px, transparent 1px);
            background-size: 8px 8px;
        }
        .screentone-dense {
            background-color: #ffffff;
            background-image: radial-gradient(#000000 1.5px, transparent 1.5px);
            background-size: 6px 6px;
        }
        .stripe-pattern {
            background-image: repeating-linear-gradient(
                -45deg,
                #000000,
                #000000 4px,
                #ffffff 4px,
                #ffffff 8px
            );
        }
        .speedlines {
            background-image: repeating-linear-gradient(
                0deg,
                #ffffff,
                #ffffff 10px,
                #000000 11px,
                #ffffff 12px
            );
        }
        .btn-neobrutal {
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            transition: all 0.1s steps(2);
        }
        .btn-neobrutal:hover {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        .btn-neobrutal:active {
            transform: translate(8px, 8px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
            filter: invert(1);
        }
    </style>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased selection:bg-primary selection:text-on-primary">
<main class="min-w-full min-h-screen screentone-bg p-4 md:p-xl flex flex-col gap-gutter">
    
    <!-- Header -->
    <header class="bg-surface-container-lowest border-4 border-primary p-md shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] w-fit">
        <h1 class="font-headline-xl text-4xl md:text-[64px] uppercase">Animanga Downloader</h1>
    </header>

    <!-- ZONA DI INPUT -->
    <section class="bg-surface-container-lowest border-4 border-primary p-gutter shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] relative z-10 flex flex-col gap-md w-full">
        <div class="flex items-center justify-between border-b-4 border-primary pb-sm mb-sm">
            <h2 class="font-headline-lg text-2xl md:text-[40px] uppercase">Pannello di Comando</h2>
            <span class="material-symbols-outlined text-4xl">terminal</span>
        </div>
        <div class="flex flex-col gap-sm">
            <label class="font-data-mono text-data-mono uppercase">URL Sorgente (Multi-Line)</label>
            <textarea id="urlInput" class="w-full bg-surface-container-low border-4 border-primary p-md font-data-mono text-data-mono focus:border-8 focus:p-[12px] outline-none resize-none" placeholder="Inserisci i link di AnimeSaturn o MangaWorld qui... (es. https://source.com/manga/chapter-1)" rows="3"></textarea>
            
            <button id="fetchBtn" class="btn-neobrutal mt-sm w-full md:w-auto self-start bg-primary text-on-primary border-4 border-primary px-8 py-sm font-headline-lg text-lg uppercase tracking-wider flex items-center justify-center gap-2">
                ANALIZZA LINK <span class="material-symbols-outlined">bolt</span>
            </button>
        </div>
    </section>

    <!-- ZONA DEI PROGRESSI -->
    <section class="flex flex-col gap-md mt-lg w-full">
        <h2 class="font-headline-lg text-2xl md:text-[40px] uppercase bg-white border-4 border-primary px-md py-sm w-fit inline-block transform -rotate-2">Le Tavole d'Azione</h2>
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-gutter w-full">
            <!-- Dynamic cards will go here -->
            <div id="emptyState" class="col-span-full font-data-mono text-data-mono text-outline-variant italic">Nessun download in coda. Incolla i link e premi ANALIZZA LINK.</div>
        </div>
    </section>

</main>

<script>
    let currentData = null;

    document.getElementById('fetchBtn').addEventListener('click', async () => {
        const urlInput = document.getElementById('urlInput').value;
        if(!urlInput.trim()) return;

        const btn = document.getElementById('fetchBtn');
        btn.innerHTML = 'ANALISI IN CORSO... <span class="material-symbols-outlined animate-spin">sync</span>';
        btn.classList.add('opacity-80', 'pointer-events-none');
        
        try {
            const data = await pywebview.api.fetch_info(urlInput);
            currentData = data;
            renderCards(data);
        } catch (e) {
            console.error("Error fetching info", e);
        } finally {
            btn.innerHTML = 'ANALIZZA LINK <span class="material-symbols-outlined">bolt</span>';
            btn.classList.remove('opacity-80', 'pointer-events-none');
        }
    });

    function renderCards(items) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';
        if(!items || items.length === 0) {
            container.innerHTML = '<div id="emptyState" class="col-span-full font-data-mono text-data-mono text-outline-variant italic">Nessun elemento trovato. Verifica i link.</div>';
            return;
        }

        items.forEach((item, index) => {
            const isAnime = item.kind === 'anime';
            const html = `
                <article id="card_${index}" class="bg-surface-container-lowest border-4 border-primary p-sm shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] flex flex-col gap-sm z-10 relative screentone-dense transition-all">
                    <div id="badge_${index}" class="absolute top-0 right-0 bg-surface-variant text-on-surface px-sm py-xs font-data-mono text-data-mono uppercase border-l-4 border-b-4 border-primary">
                        IN ATTESA
                    </div>
                    
                    <div class="bg-white border-4 border-primary p-sm mt-md relative z-10 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                        <div class="flex justify-between items-start">
                            <h3 class="font-headline-lg text-2xl font-black uppercase truncate pr-2" title="${item.title}">${item.title}</h3>
                            <span class="text-xs border-2 border-black px-1 font-bold bg-black text-white">${isAnime ? 'ANIME' : 'MANGA'}</span>
                        </div>
                        <p class="font-data-mono text-data-mono mb-2">Trovati ${item.count} ${isAnime ? 'episodi' : 'capitoli'}</p>
                        
                        <div class="flex items-center gap-sm mt-sm">
                            <label class="font-data-mono text-data-mono font-bold uppercase text-xs">Da:</label>
                            <input id="start_${index}" class="w-16 bg-white border-4 border-primary p-1 font-data-mono text-data-mono text-center outline-none focus:translate-x-[2px] focus:translate-y-[2px] focus:shadow-none transition-all shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]" type="number" min="1" max="${item.count}" value="1"/>
                            
                            <label class="font-data-mono text-data-mono font-bold uppercase ml-2 text-xs">A:</label>
                            <input id="end_${index}" class="w-16 bg-white border-4 border-primary p-1 font-data-mono text-data-mono text-center outline-none focus:translate-x-[2px] focus:translate-y-[2px] focus:shadow-none transition-all shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]" type="number" min="1" max="${item.count}" value="${item.count}"/>
                        </div>
                    </div>

                    <div class="mt-auto pt-md flex flex-col gap-xs bg-white p-sm border-4 border-primary shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                        <div class="flex justify-between font-data-mono text-data-mono text-xs mb-1">
                            <span id="status_left_${index}" class="truncate pr-2 font-bold">Pronto</span>
                            <span id="status_right_${index}">0%</span>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="w-full h-8 border-4 border-primary bg-surface-container relative overflow-hidden">
                            <div id="progress_${index}" class="absolute top-0 left-0 h-full w-0 bg-primary border-r-4 border-primary transition-all duration-300"></div>
                        </div>
                        
                        <div id="status_bottom_${index}" class="flex justify-between font-data-mono text-data-mono text-[10px] mt-1 text-outline">
                            <span>-</span>
                            <span>-</span>
                        </div>
                    </div>

                    <button id="btn_${index}" class="btn-neobrutal mt-sm w-full bg-primary text-on-primary border-4 border-primary py-sm font-headline-lg text-lg uppercase tracking-wider active:translate-x-1 active:translate-y-1 active:shadow-none transition-all" onclick="toggleDownload(${index})">
                        AVVIA DOWNLOAD
                    </button>
                </article>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    async function toggleDownload(index) {
        const btn = document.getElementById(`btn_${index}`);
        const badge = document.getElementById(`badge_${index}`);
        const card = document.getElementById(`card_${index}`);
        const progress = document.getElementById(`progress_${index}`);
        
        if (btn.innerText.includes('AVVIA') || btn.innerText.includes('RIPROVA')) {
            // Check if another download is running (since backend allows 1 at a time per API instance, 
            // actually app.py limits to one thread right now if we look at start_download).
            // Let's just start it.
            btn.innerText = 'ANNULLA';
            btn.className = "btn-neobrutal mt-sm w-full bg-white text-primary border-4 border-primary py-sm font-headline-lg text-lg uppercase tracking-wider active:translate-x-1 active:translate-y-1 active:shadow-none transition-all";
            
            badge.innerText = 'SCARICAMENTO';
            badge.className = "absolute top-0 right-0 bg-primary text-on-primary px-sm py-xs font-data-mono text-data-mono uppercase border-l-4 border-b-4 border-primary";
            
            card.classList.remove('screentone-dense');
            
            progress.className = "absolute top-0 left-0 h-full w-0 stripe-pattern border-r-4 border-primary transition-all duration-300";
            
            const start = parseInt(document.getElementById(`start_${index}`).value) || 1;
            const end = parseInt(document.getElementById(`end_${index}`).value) || 1;
            const item = currentData[index];
            
            // Mark as active card
            card.setAttribute('data-active', 'true');
            
            await pywebview.api.start_download(item, start, end);
        } else {
            // Stop Download
            await pywebview.api.stop_download();
            
            btn.innerText = 'AVVIA DOWNLOAD';
            btn.className = "btn-neobrutal mt-sm w-full bg-primary text-on-primary border-4 border-primary py-sm font-headline-lg text-lg uppercase tracking-wider active:translate-x-1 active:translate-y-1 active:shadow-none transition-all";
            
            badge.innerText = 'INTERROTTO';
            badge.className = "absolute top-0 right-0 bg-error text-on-primary px-sm py-xs font-data-mono text-data-mono uppercase border-l-4 border-b-4 border-primary";
            
            card.classList.add('screentone-dense');
            progress.className = "absolute top-0 left-0 h-full bg-primary border-r-4 border-primary transition-all duration-300";
            card.removeAttribute('data-active');
        }
    }

    function setCardCompleted(index) {
        const card = document.getElementById(`card_${index}`);
        card.className = "bg-white border-4 border-primary p-sm shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] flex flex-col gap-sm z-10 relative speedlines text-primary transition-all";
        card.removeAttribute('data-active');
        
        const badge = document.getElementById(`badge_${index}`);
        if(badge) badge.remove();
        
        // Add completion banner
        const completedBanner = `
            <div class="absolute -top-4 -left-4 bg-primary text-on-primary border-4 border-primary px-md py-xs transform -rotate-6 z-20 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                <span class="font-headline-lg text-xl font-black uppercase">COMPLETATO!</span>
            </div>
        `;
        card.insertAdjacentHTML('afterbegin', completedBanner);
        
        const progress = document.getElementById(`progress_${index}`);
        if(progress) {
            progress.style.width = '100%';
            progress.className = "absolute top-0 left-0 h-full w-full bg-primary border-r-4 border-primary";
        }
        
        document.getElementById(`status_left_${index}`).innerText = "Download Terminato";
        document.getElementById(`status_right_${index}`).innerHTML = `<span class="material-symbols-outlined align-middle">check_circle</span>`;
        document.getElementById(`status_bottom_${index}`).innerHTML = `<span></span><span></span>`;
        
        const btn = document.getElementById(`btn_${index}`);
        btn.innerText = 'FATTO';
        btn.disabled = true;
        btn.className = "mt-sm w-full bg-surface-variant text-on-surface border-4 border-primary py-sm font-headline-lg text-lg uppercase tracking-wider opacity-80 cursor-not-allowed";
        
        // Disabilita gli input
        document.getElementById(`start_${index}`).disabled = true;
        document.getElementById(`end_${index}`).disabled = true;
    }

    window.updateProgress = function(data) {
        // Find active card
        const activeCard = document.querySelector('article[data-active="true"]');
        if(!activeCard) return;
        
        const index = activeCard.id.split('_')[1];
        const progressEl = document.getElementById(`progress_${index}`);
        const statusLeft = document.getElementById(`status_left_${index}`);
        const statusRight = document.getElementById(`status_right_${index}`);
        const statusBottom = document.getElementById(`status_bottom_${index}`);

        if (data.type === "anime_progress") {
            progressEl.style.width = data.percent + '%';
            statusLeft.innerText = data.file;
            statusRight.innerText = data.percent.toFixed(1) + '%';
            statusBottom.innerHTML = `<span>V: ${data.speed}</span><span>ETA: ${data.eta}</span>`;
        } 
        else if (data.type === "anime_done" || data.type === "manga_chapter_done") {
            // Partial done (episode or chapter)
            statusLeft.innerText = data.file || ("Cap. " + data.chapter);
            statusRight.innerText = "Completato";
        } 
        else if (data.type === "manga_page_done") {
            const percent = (data.page / data.total_pages) * 100;
            progressEl.style.width = percent + '%';
            statusLeft.innerText = `Cap. ${data.chapter}`;
            statusRight.innerText = `Pag ${data.page} / ${data.total_pages}`;
        } 
        else if (data.type === "anime_series_done" || data.type === "manga_series_done") {
            setCardCompleted(index);
        } 
        else if (data.type === "anime_stop" || data.type === "error") {
            statusLeft.innerText = data.message || "Errore / Interrotto";
            statusLeft.classList.add("text-error");
            activeCard.removeAttribute('data-active');
            
            const badge = document.getElementById(`badge_${index}`);
            if(badge) {
                badge.innerText = 'ERRORE';
                badge.className = "absolute top-0 right-0 bg-error text-on-primary px-sm py-xs font-data-mono text-data-mono uppercase border-l-4 border-b-4 border-primary";
            }
            
            const btn = document.getElementById(`btn_${index}`);
            btn.innerText = 'RIPROVA';
            btn.className = "btn-neobrutal mt-sm w-full bg-primary text-on-primary border-4 border-primary py-sm font-headline-lg text-lg uppercase tracking-wider active:translate-x-1 active:translate-y-1 active:shadow-none transition-all";
            
            progressEl.className = "absolute top-0 left-0 h-full bg-error border-r-4 border-primary transition-all duration-300";
        }
    };
</script>
</body>
</html>
