    /* ============================================================
       TOKEN DI DESIGN (Neo-Brutalist)
       ============================================================ */
    :root {
        --bg: #faf9f9;
        --white: #ffffff;
        --surface-low: #f4f3f3;
        --surface: #eeeeed;
        --surface-variant: #e3e2e2;
        --ink: #000000;
        --on-ink: #ffffff;
        --text: #1a1c1c;
        --outline: #7e7576;
        --outline-variant: #cfc4c5;
        --error: #ba1a1a;
        --focus: #1c6ef2;

        --xs: 4px;  --sm: 8px;  --md: 16px;
        --gutter: 24px;  --lg: 32px;  --xl: 64px;

        --font-display: 'Epilogue', system-ui, -apple-system, sans-serif;
        --font-mono: 'Space Grotesk', ui-monospace, 'Courier New', monospace;
        --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
    }

    /* ============================================================
       RESET
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--ink); color: var(--on-ink); }
    button { font: inherit; }
    input, textarea { font: inherit; }
    svg { display: inline-block; vertical-align: middle; }

    /* Focus visibile da tastiera (accessibilità): anello blu su bottoni e campi */
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .btn:focus-visible { outline-offset: 4px; }

    /* ============================================================
       TIPOGRAFIA
       ============================================================ */
    .display-xl {
        font-family: var(--font-display); font-weight: 900;
        font-size: clamp(40px, 8vw, 64px); line-height: 1;
        letter-spacing: -0.04em; text-transform: uppercase; margin: 0;
    }
    .display-lg {
        font-family: var(--font-display); font-weight: 800;
        font-size: clamp(28px, 5vw, 40px); line-height: 1.1;
        letter-spacing: -0.02em; text-transform: uppercase; margin: 0;
    }
    .mono {
        font-family: var(--font-mono); font-weight: 600;
        font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase;
    }

    /* ============================================================
       PATTERN
       ============================================================ */
    .screentone-page {
        background-color: var(--bg);
        background-image: radial-gradient(#c6c6c6 1px, transparent 1px);
        background-size: 8px 8px;
    }
    .screentone-dense {
        background-color: #ffffff;
        background-image: radial-gradient(#000000 1.5px, transparent 1.5px);
        background-size: 6px 6px;
    }
    .stripe-pattern {
        background-image: repeating-linear-gradient(-45deg, #000 0, #000 4px, #fff 4px, #fff 8px);
    }
    .speedlines {
        background-color: #ffffff;
        background-image: repeating-linear-gradient(0deg, #fff 0, #fff 10px, #000 11px, #fff 12px);
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .app {
        min-height: 100vh;
        padding: var(--md);
        display: flex; flex-direction: column; gap: var(--gutter);
    }
    @media (min-width: 768px) { .app { padding: var(--xl); } }

    .box {
        background: var(--white);
        border: 4px solid var(--ink);
        box-shadow: 8px 8px 0 0 var(--ink);
    }

    .header { align-self: flex-start; padding: var(--md); }

    /* ---- Pannello di comando ---- */
    .panel { padding: var(--gutter); display: flex; flex-direction: column; gap: var(--md); }
    .panel__head {
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 4px solid var(--ink);
        padding-bottom: var(--sm); margin-bottom: var(--sm);
    }
    .panel__head svg { width: 36px; height: 36px; }
    .field { display: flex; flex-direction: column; gap: var(--sm); }

    .url-input {
        width: 100%; min-height: 92px;
        background: var(--surface-low);
        border: 4px solid var(--ink);
        padding: var(--md);
        font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.05em;
        color: var(--text); resize: vertical; outline: none;
    }
    .url-input:focus { border-width: 6px; padding: 14px; }
    .url-input::placeholder { color: var(--outline); }

    /* ============================================================
       BOTTONI
       ============================================================ */
    .btn {
        font-family: var(--font-display); font-weight: 800;
        font-size: 18px; text-transform: uppercase; letter-spacing: 0.05em;
        border: 4px solid var(--ink);
        padding: var(--sm) 2rem;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        cursor: pointer;
        background: var(--ink); color: var(--on-ink);
        box-shadow: 8px 8px 0 0 var(--ink);
        transition: transform 0.1s steps(2), box-shadow 0.1s steps(2);
    }
    .btn svg { width: 22px; height: 22px; }
    .btn:hover { transform: translate(4px, 4px); box-shadow: 4px 4px 0 0 var(--ink); }
    .btn:active { transform: translate(8px, 8px); box-shadow: 0 0 0 0 var(--ink); filter: invert(1); }
    .btn--ghost { background: var(--white); color: var(--ink); }
    .btn--block { width: 100%; margin-top: var(--sm); }
    .btn--fetch { width: 100%; margin-top: var(--sm); }
    @media (min-width: 768px) { .btn--fetch { width: auto; align-self: flex-start; } }
    .btn--done {
        background: var(--surface-variant); color: var(--text);
        box-shadow: none; opacity: 0.8; cursor: not-allowed;
    }
    .btn--done:hover, .btn--done:active { transform: none; box-shadow: none; filter: none; }
    .btn:disabled { cursor: not-allowed; }

    /* ============================================================
       SEZIONE RISULTATI
       ============================================================ */
    .results { display: flex; flex-direction: column; gap: var(--md); margin-top: var(--lg); }
    .section-title {
        background: var(--white); border: 4px solid var(--ink);
        padding: var(--sm) var(--md); align-self: flex-start;
        transform: rotate(-2deg);
    }
    .cards { display: grid; grid-template-columns: 1fr; gap: var(--gutter); }
    @media (min-width: 768px)  { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1280px) { .cards { grid-template-columns: repeat(3, 1fr); } }
    .empty {
        grid-column: 1 / -1;
        font-family: var(--font-mono); font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
        text-transform: uppercase; color: #5c5556;
    }
    .empty--error { color: var(--error); }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
        position: relative; z-index: 1;
        background: var(--white);
        border: 4px solid var(--ink);
        box-shadow: 12px 12px 0 0 var(--ink);
        padding: var(--sm);
        display: flex; flex-direction: column; gap: var(--sm);
    }

    .badge {
        position: absolute; top: 0; right: 0; z-index: 6;
        padding: var(--xs) var(--sm);
        font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase;
        background: var(--surface-variant); color: var(--text);
        border-left: 4px solid var(--ink); border-bottom: 4px solid var(--ink);
    }
    .badge--active { background: var(--ink); color: var(--on-ink); }
    .badge--error  { background: var(--error); color: #fff; }

    .card__body {
        position: relative; z-index: 1;
        background: var(--white); border: 4px solid var(--ink);
        box-shadow: 4px 4px 0 0 var(--ink);
        padding: var(--sm); margin-top: var(--md);
    }
    .card__titlerow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card__title {
        font-family: var(--font-display); font-weight: 900; font-size: 22px;
        text-transform: uppercase; margin: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tag {
        font-size: 12px; font-weight: 700; white-space: nowrap;
        border: 2px solid var(--ink); padding: 0 4px;
        background: var(--ink); color: #fff;
    }
    .card__count { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.05em; margin: 8px 0; }

    .range { display: flex; align-items: center; gap: var(--sm); margin-top: var(--sm); flex-wrap: wrap; }
    .range label { font-family: var(--font-mono); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .range input {
        width: 64px; text-align: center;
        background: #fff; border: 4px solid var(--ink); padding: 4px;
        font-family: var(--font-mono); font-size: 14px;
        box-shadow: 2px 2px 0 0 var(--ink); outline: none;
    }
    .range input:focus { transform: translate(2px, 2px); box-shadow: none; }
    .range input:disabled { opacity: 0.5; }

    /* ---- Progressi ---- */
    .progressbox {
        margin-top: auto;
        background: #fff; border: 4px solid var(--ink);
        box-shadow: 4px 4px 0 0 var(--ink);
        padding: var(--sm);
        display: flex; flex-direction: column; gap: var(--xs);
    }
    .progressbox__row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; }
    .progressbox__row .left {
        font-weight: 700; padding-right: 8px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .progressbox__row svg { width: 16px; height: 16px; }
    .progress {
        width: 100%; height: 32px; position: relative; overflow: hidden;
        border: 4px solid var(--ink); background: var(--surface);
    }
    .progress__fill {
        position: absolute; top: 0; left: 0; height: 100%; width: 0;
        background: var(--ink); border-right: 4px solid var(--ink);
        transition: width 0.3s;
    }
    .progress__fill.stripe-pattern { background-color: transparent; }
    .progress__fill--error { background: var(--error); }
    .progressbox__foot {
        display: flex; justify-content: space-between;
        font-family: var(--font-mono); font-size: 11px; color: var(--text); opacity: 0.72; margin-top: 4px;
    }

    .banner {
        position: absolute; top: -16px; left: -16px; z-index: 20;
        background: var(--ink); color: var(--on-ink);
        border: 4px solid var(--ink);
        padding: var(--xs) var(--md);
        transform: rotate(-6deg);
        box-shadow: 4px 4px 0 0 var(--ink);
        font-family: var(--font-display); font-weight: 900; font-size: 20px; text-transform: uppercase;
    }

    .text-error { color: var(--error); }
    .input-error { border-color: var(--error) !important; }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .spin { display: inline-flex; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<main class="app screentone-page">

    <!-- Header -->
    <header class="box header">
        <h1 class="display-xl">AniManga Downloader</h1>
    </header>

    <!-- Pannello di input -->
    <section class="box panel">
        <div class="panel__head">
            <h2 class="display-lg">Pannello di Comando</h2>
            <!-- icon: terminal -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </div>
        <div class="field">
            <label class="mono" for="urlInput">URL Sorgente (Multi-Line)</label>
            <textarea id="urlInput" class="url-input" rows="3" placeholder="Inserisci i link di AnimeSaturn o MangaWorld qui... (uno per riga o separati da spazi)"></textarea>
            <button id="fetchBtn" class="btn btn--fetch" type="button">
                ANALIZZA LINK
                <!-- icon: bolt -->
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            </button>
        </div>
    </section>

    <!-- Sezione progressi -->
    <section class="results">
        <h2 class="display-lg section-title">Le Tavole d'Azione</h2>
        <div id="cardsContainer" class="cards">
            <div id="emptyState" class="empty">Nessun download in coda. Incolla i link e premi ANALIZZA LINK.</div>
        </div>
    </section>

</main>

<script>
    "use strict";

    // --- Icone SVG inline (nessuna dipendenza esterna) ---
    const ICON = {
        bolt:  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
        sync:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16 9.5"/></svg>'
    };

    let currentData = null;
    // Stato per il progresso AGGREGATO degli anime (download in parallelo):
    // animeState[index] = { total, completed, errors, active: {file: frazione 0..1} }
    const animeState = {};

    const fetchBtn = document.getElementById('fetchBtn');
    const urlInput = document.getElementById('urlInput');
    const container = document.getElementById('cardsContainer');

    function flashInputError(el) {
        el.classList.add('input-error', 'shake');
        setTimeout(() => el.classList.remove('input-error', 'shake'), 600);
    }

    fetchBtn.addEventListener('click', async () => {
        if (!urlInput.value.trim()) {
            urlInput.focus();
            flashInputError(urlInput);  // campo vuoto: feedback visivo
            return;
        }

        fetchBtn.disabled = true;
        fetchBtn.innerHTML = 'ANALISI IN CORSO... <span class="spin">' + ICON.sync + '</span>';

        try {
            const data = await pywebview.api.fetch_info(urlInput.value);
            currentData = data;
            renderCards(data);
        } catch (e) {
            console.error("Errore durante l'analisi", e);
            container.innerHTML = '<div class="empty empty--error">Errore durante l\'analisi. Controlla i link o la connessione e riprova.</div>';
        } finally {
            fetchBtn.disabled = false;
            fetchBtn.innerHTML = 'ANALIZZA LINK ' + ICON.bolt;
        }
    });

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    function renderCards(items) {
        container.innerHTML = '';
        if (!items || items.length === 0) {
            container.innerHTML = '<div id="emptyState" class="empty">Nessun elemento trovato. Verifica i link.</div>';
            return;
        }

        items.forEach((item, index) => {
            const isAnime = item.kind === 'anime';
            const kindLabel = isAnime ? 'ANIME' : 'MANGA';
            const unit = isAnime ? 'episodi' : 'capitoli';
            const title = escapeHtml(item.title);
            const count = item.count;

            const html = `
                <article id="card_${index}" class="card screentone-dense" data-state="idle">
                    <div id="badge_${index}" class="badge">IN ATTESA</div>

                    <div class="card__body">
                        <div class="card__titlerow">
                            <h3 class="card__title" title="${title}">${title}</h3>
                            <span class="tag">${kindLabel}</span>
                        </div>
                        <p class="card__count">Trovati ${count} ${unit}</p>
                        <div class="range">
                            <label for="start_${index}">Da:</label>
                            <input id="start_${index}" type="number" min="1" max="${count}" value="1"/>
                            <label for="end_${index}">A:</label>
                            <input id="end_${index}" type="number" min="1" max="${count}" value="${count}"/>
                        </div>
                    </div>

                    <div class="progressbox">
                        <div class="progressbox__row">
                            <span id="status_left_${index}" class="left">Pronto</span>
                            <span id="status_right_${index}">0%</span>
                        </div>
                        <div class="progress">
                            <div id="progress_${index}" class="progress__fill"></div>
                        </div>
                        <div id="status_bottom_${index}" class="progressbox__foot">
                            <span>-</span><span>-</span>
                        </div>
                    </div>

                    <button id="btn_${index}" class="btn btn--block" type="button" onclick="toggleDownload(${index})">
                        AVVIA DOWNLOAD
                    </button>
                </article>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    async function toggleDownload(index) {
        const card  = document.getElementById(`card_${index}`);
        const btn   = document.getElementById(`btn_${index}`);
        const badge = document.getElementById(`badge_${index}`);
        const fill  = document.getElementById(`progress_${index}`);
        const state = card.dataset.state;

        if (state === 'downloading') {
            // --- Ferma il download ---
            await pywebview.api.stop_download(index);

            card.dataset.state = 'idle';
            card.removeAttribute('data-active');
            card.classList.add('screentone-dense');

            btn.textContent = 'AVVIA DOWNLOAD';
            btn.className = 'btn btn--block';

            badge.textContent = 'INTERROTTO';
            badge.className = 'badge badge--error';

            fill.className = 'progress__fill';
            return;
        }

        // --- Avvia (o riprova) il download ---
        const max = (currentData[index] && currentData[index].count) || 1;
        const startEl = document.getElementById(`start_${index}`);
        const endEl   = document.getElementById(`end_${index}`);
        const statusLeft = document.getElementById(`status_left_${index}`);

        let start = parseInt(startEl.value, 10);
        let end   = parseInt(endEl.value, 10);
        if (!Number.isInteger(start)) start = 1;
        if (!Number.isInteger(end))   end = max;
        // clamp nell'intervallo valido [1, max]
        start = Math.min(Math.max(start, 1), max);
        end   = Math.min(Math.max(end, 1), max);

        if (start > end) {
            statusLeft.textContent = 'Intervallo non valido: DA deve essere ≤ A';
            statusLeft.classList.add('text-error');
            flashInputError(startEl);
            flashInputError(endEl);
            return;  // non avviare: evita falsi "COMPLETATO"
        }
        statusLeft.classList.remove('text-error');
        startEl.value = start;  // riscrive gli eventuali valori clampati
        endEl.value = end;

        card.dataset.state = 'downloading';
        card.setAttribute('data-active', 'true');
        card.classList.remove('screentone-dense');

        btn.textContent = 'ANNULLA';
        btn.className = 'btn btn--block btn--ghost';

        badge.textContent = 'SCARICAMENTO';
        badge.className = 'badge badge--active';

        fill.className = 'progress__fill stripe-pattern';
        statusLeft.textContent = 'Avvio download…';  // finché non arriva il 1° progresso

        await pywebview.api.start_download(currentData[index], start, end, index);
    }

    function setCardCompleted(index) {
        const card = document.getElementById(`card_${index}`);
        card.dataset.state = 'done';
        card.removeAttribute('data-active');
        card.classList.remove('screentone-dense');
        card.classList.add('speedlines');

        const badge = document.getElementById(`badge_${index}`);
        if (badge) badge.remove();

        if (!card.querySelector('.banner')) {
            const banner = document.createElement('div');
            banner.className = 'banner';
            banner.textContent = 'COMPLETATO!';
            card.insertAdjacentElement('afterbegin', banner);
        }

        const fill = document.getElementById(`progress_${index}`);
        if (fill) { fill.style.width = '100%'; fill.className = 'progress__fill'; }

        document.getElementById(`status_left_${index}`).textContent = 'Download Terminato';
        document.getElementById(`status_right_${index}`).innerHTML = ICON.check;
        document.getElementById(`status_bottom_${index}`).innerHTML = '<span></span><span></span>';

        const btn = document.getElementById(`btn_${index}`);
        btn.textContent = 'FATTO';
        btn.disabled = true;
        btn.className = 'btn btn--block btn--done';

        document.getElementById(`start_${index}`).disabled = true;
        document.getElementById(`end_${index}`).disabled = true;
    }

    // Progresso anime aggregato: la barra riflette (episodi completati + frazioni
    // in corso) / totale, invece di saltare tra i 4 download paralleli.
    function renderAnimeProgress(index, data) {
        const st = animeState[index];
        if (!st) return;
        const total = st.total || 1;
        const activeSum = Object.values(st.active).reduce((a, b) => a + b, 0);
        const overall = Math.min(((st.completed + activeSum) / total) * 100, 99);
        document.getElementById(`progress_${index}`).style.width = overall + '%';
        document.getElementById(`status_right_${index}`).textContent = `${st.completed}/${st.total} ep`;
        const inflight = Object.keys(st.active);
        document.getElementById(`status_left_${index}`).textContent = inflight.length
            ? `${inflight.length} in download: ${inflight.join(', ')}`
            : `${st.completed}/${st.total} episodi completati`;
        if (data && data.type === "anime_progress") {
            document.getElementById(`status_bottom_${index}`).innerHTML =
                `<span>V: ${data.speed}</span><span>ETA: ${data.eta}</span>`;
        }
    }

    // Stato di errore riusabile (interruzione, player non risolto, download fallito).
    function showCardError(index, message) {
        const card = document.getElementById(`card_${index}`);
        card.dataset.state = 'error';
        card.removeAttribute('data-active');
        const statusLeft = document.getElementById(`status_left_${index}`);
        statusLeft.textContent = message || "Errore / Interrotto";
        statusLeft.classList.add("text-error");
        const badge = document.getElementById(`badge_${index}`);
        if (badge) { badge.textContent = 'ERRORE'; badge.className = 'badge badge--error'; }
        const btn = document.getElementById(`btn_${index}`);
        btn.textContent = 'RIPROVA';
        btn.className = 'btn btn--block';
        document.getElementById(`progress_${index}`).className = 'progress__fill progress__fill--error';
    }

    window.updateProgress = function (data) {
        // Instradiamo l'evento alla card indicata dal backend (index), così
        // più download in parallelo aggiornano ciascuno la propria scheda.
        const index = (data.index !== undefined && data.index !== null) ? String(data.index) : null;
        if (index === null) return;
        const activeCard = document.getElementById(`card_${index}`);
        if (!activeCard) return;
        const fill        = document.getElementById(`progress_${index}`);
        const statusLeft  = document.getElementById(`status_left_${index}`);
        const statusRight = document.getElementById(`status_right_${index}`);
        const statusBottom = document.getElementById(`status_bottom_${index}`);

        if (data.type === "anime_series_start") {
            animeState[index] = { total: data.total, completed: 0, errors: 0, active: {} };
            fill.style.width = "0%";
            statusLeft.textContent = data.total ? `0/${data.total} episodi` : "Nessun nuovo episodio da scaricare";
            statusRight.textContent = data.total ? `0/${data.total}` : "—";
            statusBottom.innerHTML = "<span>-</span><span>-</span>";
        }
        else if (data.type === "anime_start") {
            const st = animeState[index];
            if (st) st.active[data.file] = 0;
            renderAnimeProgress(index);
        }
        else if (data.type === "anime_progress") {
            const st = animeState[index];
            if (st) st.active[data.file] = data.percent / 100;
            renderAnimeProgress(index, data);
        }
        else if (data.type === "anime_skip") {
            const st = animeState[index];
            if (st) { st.completed++; delete st.active[data.file]; }
            renderAnimeProgress(index);
            statusBottom.innerHTML = `<span>${data.file} già presente ⏭</span><span></span>`;
        }
        else if (data.type === "anime_error") {
            const st = animeState[index];
            if (st) { st.errors++; st.completed++; delete st.active[data.file]; }
            renderAnimeProgress(index);
            statusBottom.innerHTML = `<span class="text-error">${data.message || 'Errore episodio'}</span><span></span>`;
        }
        else if (data.type === "manga_chapter_progress") {
            const overallPercent = ((data.current_chapter - 1) / data.total_chapters) * 100;
            fill.style.width = overallPercent + '%';
            statusLeft.textContent = data.message;
            statusRight.textContent = `Cap ${data.current_chapter}/${data.total_chapters}`;
            statusBottom.innerHTML = `<span>Scaricamento in corso...</span><span></span>`;
        }
        else if (data.type === "manga_page_done") {
            const chapData = activeCard.getAttribute('data-current-chapter') || '1';
            const totalChaps = activeCard.getAttribute('data-total-chapters') || '1';
            const chapterBase = (parseInt(chapData, 10) - 1) / parseInt(totalChaps, 10);
            const pageContrib = (data.page / data.total_pages) / parseInt(totalChaps, 10);
            const overallPercent = (chapterBase + pageContrib) * 100;
            fill.style.width = Math.min(overallPercent, 99) + '%';
            statusLeft.textContent = `Cap. ${data.chapter} - Pag ${data.page}/${data.total_pages}`;
            statusRight.textContent = `Cap ${chapData}/${totalChaps}`;
        }
        else if (data.type === "manga_chapter_start") {
            if (data.chapter) {
                statusLeft.textContent = `Cap. ${data.chapter} (${data.total_pages} pagine)`;
            }
        }
        else if (data.type === "anime_done") {
            const st = animeState[index];
            if (st) { st.completed++; delete st.active[data.file]; }
            renderAnimeProgress(index);
        }
        else if (data.type === "manga_chapter_done") {
            statusLeft.textContent = "Cap. " + data.chapter + " ✓";
        }
        else if (data.type === "manga_skip") {
            statusBottom.innerHTML = `<span>Cap. ${data.chapter} già presente ⏭</span><span></span>`;
        }
        else if (data.type === "manga_chapter_error") {
            statusLeft.textContent = data.message || "Errore capitolo";
            statusBottom.innerHTML = `<span class="text-error">Continuo con il prossimo...</span><span></span>`;
            // NON rimuovere data-active: il download continua
        }
        else if (data.type === "anime_series_done") {
            const st = animeState[index];
            if (st && st.total > 0 && st.errors >= st.total) {
                showCardError(index, `Nessun episodio scaricato (${st.errors}/${st.total} falliti)`);
            } else {
                setCardCompleted(index);
            }
            delete animeState[index];
        }
        else if (data.type === "manga_series_done") {
            setCardCompleted(index);
        }
        else if (data.type === "anime_stop" || data.type === "error") {
            showCardError(index, data.message);
        }

        // Salva info capitolo corrente nella card per il calcolo del progresso
        if (data.current_chapter !== undefined) {
            activeCard.setAttribute('data-current-chapter', data.current_chapter);
            activeCard.setAttribute('data-total-chapters', data.total_chapters);
        }
    };
</script>
</body>
</html>
